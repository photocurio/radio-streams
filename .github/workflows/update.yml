name: Weekly KBCS Scraper

on:
  schedule:
    - cron: '0 10 * * 3'   # Every Wednesday at 4:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Run scraper-lite.js
        run: node scraper-lite.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kbcs.m3u8 latest-url.txt
          git commit -m "Update KBCS stream URL [bot]" || echo "No changes to commit"
          git push
